name: Build the one final Windows-ready release
on:
  push:
    branches:
      - "release/v*"
permissions:
  contents: write
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Node tests
        run: node --test tests/test_core.cjs tests/test_amap_map.cjs
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tooling
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium end-to-end tests
        run: node tests/test_browser.cjs
  publish:
    needs: [validate, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean ZIP and SHA256
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          ZIP="MultiRoute-Monitor-${VERSION}-Windows.zip"
          git archive --format=zip --prefix="MultiRoute-Monitor-${VERSION}/" "${GITHUB_SHA}" -o "${ZIP}"
          sha256sum "${ZIP}" > "${ZIP}.sha256"
          printf '%s\n' "${ZIP}" > release-asset-name.txt
      - name: Publish the single final GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          ZIP="$(cat release-asset-name.txt)"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${ZIP}" "${ZIP}.sha256" --clobber
          else
            gh release create "${VERSION}" "${ZIP}" "${ZIP}.sha256" \
              --target "${GITHUB_SHA}" \
              --title "MultiRoute-Monitor ${VERSION}" \
              --notes "Final Windows-ready MultiRoute-Monitor build. Windows, Ubuntu and Chromium tests passed on this exact commit. Local secrets and local data are excluded. Real AMap calls remain disabled until written permission and account-level free quota are confirmed in the in-app gate."
          fi
